services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: editor
      POSTGRES_PASSWORD: editor
      POSTGRES_DB: photo_merge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U editor -d photo_merge"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    image: python:3.11-slim
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg2://editor:editor@db:5432/photo_merge
      STORAGE_DIR: /app/storage
      PHASH_THRESHOLD: "16"
    volumes:
      - ./backend:/app
      - ./frontend/dist:/frontend-dist:ro
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
